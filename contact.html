<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Success Glow Ventures</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; color: #222; background: #fafafa; }
a { text-decoration: none; color: inherit; }
header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 24px; background: #fff; border-bottom: 1px solid #eee;
  position: sticky; top: 0; z-index: 10;
}
.logo { font-family: Georgia, serif; font-size: 20px; font-weight: bold; color: #111; }
.logo span { color: #C9A227; }
nav { display: flex; gap: 22px; }
nav a { font-size: 14px; color: #333; }
.menu-toggle { display: none; flex-direction: column; gap: 4px; cursor: pointer; background:none; border:none; }
.menu-toggle div { width: 22px; height: 2px; background: #111; }
@media (max-width: 640px) {
  nav { display: none; flex-direction: column; position: absolute; top: 62px; left: 0; right: 0; background: #fff; padding: 16px 24px; border-bottom: 1px solid #eee; }
  nav.open { display: flex; }
  .menu-toggle { display: flex; }
}
.page-hero { background: #111; color: #fff; text-align: center; padding: 50px 24px; }
.page-hero p.eyebrow { color: #C9A227; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px; }
.page-hero h1 { font-family: Georgia, serif; font-size: 28px; }
.section { padding: 60px 24px; max-width: 500px; margin: 0 auto; }
.contact-options { display: flex; flex-direction: column; gap: 14px; margin-bottom: 40px; }
.contact-btn {
  display: flex; align-items: center; gap: 14px; padding: 16px 18px;
  border: 1px solid #eee; border-radius: 10px; background: #fff; font-size: 15px; color: #111;
}
.contact-btn .icon { font-size: 22px; }
form { display: flex; flex-direction: column; gap: 14px; }
form label { font-size: 13px; color: #555; }
form input, form textarea {
  padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit;
}
form textarea { min-height: 100px; }
.btn-gold {
  background: #C9A227; color: #111; font-weight: bold; border: none;
  padding: 13px; border-radius: 6px; font-size: 14px; cursor: pointer;
}
footer { background: #111; color: #ccc; padding: 40px 24px; text-align: center; }
footer .logo { color: #fff; font-size: 18px; margin-bottom: 16px; display: block; }
.social-row { display: flex; justify-content: center; gap: 14px; margin: 18px 0; }
.social-icon { width: 38px; height: 38px; border-radius: 50%; background: #C9A227; display: flex; align-items: center; justify-content: center; font-size: 16px; }
footer .copy { font-size: 12px; color: #888; margin-top: 20px; }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">Success Glow <span>Ventures</span></a>
  <button class="menu-toggle" onclick="document.getElementById('nav').classList.toggle('open')">
    <div></div><div></div><div></div>
  </button>
  <nav id="nav">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="page-hero">
  <p class="eyebrow">Get In Touch</p>
  <h1>Contact Us</h1>
</div>

<div class="section">

  <div class="contact-options">
    <a href="https://wa.me/2347067019699" class="contact-btn" target="_blank">
      <span class="icon">💬</span> Chat on WhatsApp
    </a>
    <a href="https://www.facebook.com/profile.php?id=61556378224722" class="contact-btn" target="_blank">
      <span class="icon">📘</span> Message us on Facebook
    </a>
  </div>

  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <div>
      <label>Your Name</label>
      <input type="text" name="name" required>
    </div>
    <div>
      <label>Your Email</label>
      <input type="email" name="email" required>
    </div>
    <div>
      <label>Message</label>
      <textarea name="message" required></textarea>
    </div>
    <button type="submit" class="btn-gold">Send Message</button>
  </form>

</div>

<footer>
  <span class="logo">Success Glow Ventures</span>
  <p>Quality products at affordable prices.</p>
  <div class="social-row">
    <a href="https://www.facebook.com/profile.php?id=61556378224722" class="social-icon" target="_blank">📘</a>
    <a href="https://wa.me/2347067019699" class="social-icon" target="_blank">💬</a>
  </div>
  <p class="copy">&copy; 2026 Success Glow Ventures. All rights reserved.</p>
</footer>

</body>
</html>
